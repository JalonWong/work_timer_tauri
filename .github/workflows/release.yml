name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
            goos: linux
          - os: windows-2022
            goos: windows
          - os: macos-13
            goos: osx-amd64
          - os: macos-latest
            goos: osx-arm64

    steps:
      - uses: actions/checkout@main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: pnpm/setup@main
        with:
          version: 11
          cache: true
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev pkg-config libasound2-dev
        if: matrix.goos == 'linux'
      - name: build
        run: python release/release.py
      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          path: release/Work-Timer*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Display structure of downloaded files
        run: ls -R artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: artifacts/*/*
